<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tables with Headers and Footers</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="task">
<p class="task-label">Task 1: marks table</p>
<table>
<caption>Marks of Class A</caption>
<thead>
<tr><th>Name</th><th>Maths</th><th>Science</th></tr>
</thead>
<tbody>
<tr><td>Asha</td><td>78</td><td>85</td></tr>
<tr><td>Rohan</td><td>64</td><td>70</td></tr>
<tr><td>Neha</td><td>91</td><td>88</td></tr>
</tbody>
</table>
</section>
<section class="task">
<p class="task-label">Task 2: table with average</p>
<table>
<caption>Marks of Class A</caption>
<thead>
<tr><th>Name</th><th>Maths</th><th>Science</th></tr>
</thead>
<tbody>
<tr><td>Asha</td><td>78</td><td>85</td></tr>
<tr><td>Rohan</td><td>64</td><td>70</td></tr>
</tbody>
<tfoot>
<tr><td>Class average</td><td>71</td><td>77.5</td></tr>
</tfoot>
</table>
</section>
<section class="task">
<p class="task-label">Task 3: accessible table</p>
<table>
<caption>Marks of Class A</caption>
<thead>
<tr><th scope="col">Name</th><th scope="col">Maths</th><th scope="col">Science</th></tr>
</thead>
<tbody>
<tr><th scope="row">Asha</th><td>78</td><td>85</td></tr>
<tr><th scope="row">Rohan</th><td>64</td><td>70</td></tr>
</tbody>
</table>
</section>
</body>
</html>
