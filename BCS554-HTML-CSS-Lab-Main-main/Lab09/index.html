<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign-Up Forms and Choices</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="task">
<p class="task-label">Task 1: sign-up form</p>
<h2>Sign Up</h2>
<form method="post" action="#">
<p><label for="fullname">Full name:</label>
<input type="text" id="fullname" name="fullname"></p>
<p><label for="email">Email:</label>
<input type="email" id="email" name="email"></p>
<p><label for="password">Password:</label>
<input type="password" id="password" name="password"></p>
<button type="submit">Sign Up</button>
</form>
</section>
<section class="task">
<p class="task-label">Task 2: choices</p>
<h2>Choices</h2>
<form>
<p>Gender:</p>
<input type="radio" id="female" name="gender" value="female">
<label for="female">Female</label>
<input type="radio" id="male" name="gender" value="male">
<label for="male">Male</label>
<p><label for="course">Course:</label>
<select id="course" name="course">
<option value="bca">BCA</option>
<option value="btech">B.Tech</option>
</select></p>
</form>
</section>
<section class="task">
<p class="task-label">Task 3: required fields</p>
<h2>Sign Up</h2>
<form>
<p><label for="fullname2">Full name:</label>
<input type="text" id="fullname2" name="fullname2" placeholder="Enter your full name" required></p>
<p><label for="email2">Email:</label>
<input type="email" id="email2" name="email2" required></p>
<button type="submit">Submit</button>
</form>
</section>
</body>
</html>
